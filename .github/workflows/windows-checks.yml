name: Windows checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  regression:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Regression checks
        run: |
          foreach ($testFile in (Get-ChildItem tests/check_*.py)) {
            python -B $testFile.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
